name: Auto-Blogger Agent

on:
  schedule:
    # Runs at 08:00 UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate-article:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install --upgrade google-genai

      - name: Run AI Content Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent/main.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "Auto-Blogger Agent"
          git config --global user.email "agent@nexusai.local"
          git add posts/ marketing/
          git commit -m "Automated article & Reddit distribution package published" || echo "No changes to commit"
          git pull --rebase origin main
          git push
